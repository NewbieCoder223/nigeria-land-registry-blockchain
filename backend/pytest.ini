[pytest]
# WHY: web3.py 6.x registers a pytest plugin (pytest_ethereum / ethpm) that uses
# a deprecated `ContractName` type from eth_typing which no longer exists.
# This causes pytest to crash at startup before any tests can run.
# Solution: disable the entire 'web3' pytest plugin via addopts.
addopts = -p no:web3
testpaths = tests
