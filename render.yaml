services:
  # 1. Flask API Web Service
  - type: web
    name: sovereign-ledger-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: POLYGON_AMOY_RPC_URL
        sync: false
      - key: LAND_REGISTRY_ADDRESS
        sync: false
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_API_SECRET
        sync: false
      - key: NIN_PROVIDER
        value: mock

  # 2. Blockchain Indexer (Sync)
  - type: worker
    name: sovereign-ledger-sync
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/sync.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: POLYGON_AMOY_RPC_URL
        sync: false
      - key: LAND_REGISTRY_ADDRESS
        sync: false
